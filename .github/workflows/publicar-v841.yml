name: Reconstruir y verificar V841 original
on:
  push:
    branches: [publicacion-v841-20261107]
    paths: ['.github/workflows/publicar-v841.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unir y validar HTML V841
        shell: bash
        run: |
          set -euo pipefail
          cat v841-source/parte-{01..07}.htmlfrag > index.html
          test "$(wc -c < index.html)" -eq 3985019
          echo "20715914e6dd5e0c5248a9b81c9a6f58ed2682f6c6336ab73946820b78bf3026  index.html" | sha256sum --check
      - name: Guardar index.html completo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && exit 0
          git commit -m "Publicar index.html V841 original verificado"
          git push origin HEAD:publicacion-v841-20261107
